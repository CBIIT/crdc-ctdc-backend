        - tissue_category
        - assessment_timepoint
        - specimen_record_id
        - data_file_name
        - data_file_format
        - data_file_type
        - data_file_uuid
        - drs_uri
        - data_file_description
        - data_file_checksum_value
        - data_file_checksum_type
        - data_file_location
        - data_file_compression_status
        - association
        - participant_id
        - ctep_disease_term
        - primary_diagnosis_disease_group
        - stage_of_disease
        - tumor_grade
        - survival_status
        - primary_disease_site
        - meddra_disease_code
        - histology
        - sex
        - race
