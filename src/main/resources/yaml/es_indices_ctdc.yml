indices:
  - index_name: "widgets_facets_counts"
    id_field: "participant_id"
    mapping:
      long:
        - numberOfParticipants
        - numberOfDiagnoses
        - numberOfTargeted
        - numberOfNonTargeted
        - numberOfTherapies
        - dataFileCount
      keyword:
        - type
        - participant_id
        - study_short_name
        - study_id
        - ctep_disease_term
        - snomed_disease_code
        - tumor_grade
        - stage_of_disease
        - diagnosis_id
        - survival_status
        - sex
        - race
        - ethnicity
        - carcinogen_exposure
        - targeted_therapy
        - primary_diagnosis_disease_group
        - targeted_therapy_id
        - targeted_therapy_string
        - best_response_to_targeted_therapy
        - anatomical_collection_site
        - tissue_category
        - assessment_timepoint
        - specimen_id
        - specimen_type
        - data_file_uuid
        - data_file_type
        - data_file_format
        - biospecimen_info.specimen_id
        - biospecimen_info.anatomical_collection_site
        - biospecimen_info.tissue_category
        - biospecimen_info.assessment_timepoint
        - file_info.data_file_uuid
        - file_info.data_file_type
        - file_info.data_file_format

    initial_query:
      query: |
          MATCH (study:study)<-[:belongs_to]-(sb:participant)
          WITH DISTINCT sb, study

          CALL {
            WITH sb, study
            OPTIONAL MATCH (sb)<-[:of_participant]-(tt:targeted_therapy)
            WITH
              COLLECT(DISTINCT CASE WHEN tt.targeted_therapy IS NOT NULL AND trim(toString(tt.targeted_therapy)) <> '' THEN tt.targeted_therapy ELSE null END) AS tt_names,
              COLLECT(DISTINCT CASE WHEN tt.targeted_therapy_id IS NOT NULL THEN tt.targeted_therapy_id ELSE null END) AS tt_ids,
              COLLECT(DISTINCT CASE WHEN tt.best_response_to_targeted_therapy IS NOT NULL AND toString(tt.best_response_to_targeted_therapy) <> '' THEN toString(tt.best_response_to_targeted_therapy) ELSE null END) AS responses
            WITH
              [x IN tt_names WHERE x IS NOT NULL] AS targeted_therapy,
              [x IN tt_ids WHERE x IS NOT NULL] AS targeted_therapy_id,
              [x IN responses WHERE x IS NOT NULL] AS best_response_to_targeted_therapy
            RETURN
              targeted_therapy,
              targeted_therapy_id,
              REDUCE(s = '', x IN targeted_therapy | s + CASE WHEN s = '' THEN '' ELSE '|' END + toString(x)) AS targeted_therapy_string,
              best_response_to_targeted_therapy
          }

          CALL {
            WITH sb, study
            OPTIONAL MATCH (spec_acs:specimen)-[:of_participant]->(sb)
            WITH COLLECT(DISTINCT CASE WHEN spec_acs.anatomical_collection_site IS NOT NULL AND spec_acs.anatomical_collection_site <> '' THEN toLower(trim(spec_acs.anatomical_collection_site)) ELSE null END) AS acs
            RETURN [s IN acs WHERE s IS NOT NULL] AS anatomical_collection_site
          }

          CALL {
            WITH sb, study
            OPTIONAL MATCH (demo:demographic)-[:of_participant]->(sb)
            WITH
              COLLECT(DISTINCT CASE WHEN demo.race IS NOT NULL AND demo.race <> '' THEN demo.race ELSE null END) AS races,
              COLLECT(DISTINCT CASE WHEN demo.sex IS NOT NULL AND demo.sex <> '' THEN demo.sex ELSE null END) AS sexes,
              COLLECT(DISTINCT CASE WHEN demo.ethnicity IS NOT NULL AND demo.ethnicity <> '' THEN demo.ethnicity ELSE null END) AS ethnicities
            RETURN
              [r IN races WHERE r IS NOT NULL] AS race,
              [s IN sexes WHERE s IS NOT NULL] AS sex,
              [e IN ethnicities WHERE e IS NOT NULL] AS ethnicity
          }

          OPTIONAL MATCH (spec:specimen)-[:of_participant]->(sb)
          OPTIONAL MATCH (sb)<-[*..2]-(file:file)
          OPTIONAL MATCH (diag:diagnosis)-[:of_participant]->(sb)
          OPTIONAL MATCH (expose:exposure)-[:of_participant]->(sb)
          OPTIONAL MATCH (ps:participant_status)-[:of_participant]->(sb)

          OPTIONAL MATCH (study)<-[:associated_with]-(study_zip_file:file)
          WHERE toLower(COALESCE(study_zip_file.data_file_format, '')) = 'zip'
            AND NOT (study_zip_file)--(:participant)
            AND NOT (study_zip_file)-[:associated_with]->(:specimen)

          RETURN DISTINCT
          'participant' AS type,
          sb.participant_id AS participant_id,
          COLLECT(DISTINCT study.study_short_name) AS study_short_name,
          COLLECT(DISTINCT toString(study.study_id)) AS study_id,

          COLLECT(DISTINCT diag.ctep_disease_term) AS ctep_disease_term,
          COLLECT(DISTINCT diag.primary_diagnosis_disease_group) AS primary_diagnosis_disease_group,
          COLLECT(DISTINCT diag.snomed_disease_code) AS snomed_disease_code,
          COLLECT(DISTINCT diag.tumor_grade) AS tumor_grade,
          COLLECT(DISTINCT diag.stage_of_disease) AS stage_of_disease,
          COLLECT(DISTINCT diag.diagnosis_id) AS diagnosis_id,
          COLLECT(DISTINCT ps.survival_status) AS survival_status,

          sex,
          race,
          ethnicity,
          COLLECT(DISTINCT expose.carcinogen_exposure) AS carcinogen_exposure,
          targeted_therapy,
          targeted_therapy_id,
          targeted_therapy_string,
          best_response_to_targeted_therapy,
          anatomical_collection_site,
          COLLECT(DISTINCT spec.tissue_category) AS tissue_category,
          COLLECT(DISTINCT spec.assessment_timepoint) AS assessment_timepoint,
          COLLECT(DISTINCT spec.specimen_id) AS specimen_id,
          COLLECT(DISTINCT COALESCE(spec.specimen_type, '')) AS specimen_type,
          [x IN COLLECT(DISTINCT file.data_file_type) + COLLECT(DISTINCT study_zip_file.data_file_type) WHERE x IS NOT NULL] AS data_file_type,
          [x IN COLLECT(DISTINCT file.data_file_uuid) + COLLECT(DISTINCT study_zip_file.data_file_uuid) WHERE x IS NOT NULL] AS data_file_uuid,
          [x IN COLLECT(DISTINCT file.data_file_format) + COLLECT(DISTINCT study_zip_file.data_file_format) WHERE x IS NOT NULL] AS data_file_format,
          COLLECT(DISTINCT {
            specimen_id: spec.specimen_id,
            anatomical_collection_site: spec.anatomical_collection_site,
            tissue_category: spec.tissue_category,
            assessment_timepoint: spec.assessment_timepoint
          }) AS biospecimen_info,
          [x IN COLLECT(DISTINCT {
            data_file_uuid: file.data_file_uuid,
            data_file_format: file.data_file_format,
            data_file_type: file.data_file_type
          }) + COLLECT(DISTINCT {
            data_file_uuid: study_zip_file.data_file_uuid,
            data_file_format: study_zip_file.data_file_format,
            data_file_type: study_zip_file.data_file_type
          }) WHERE x.data_file_uuid IS NOT NULL] AS file_info
          SKIP $skip LIMIT $limit
      page_size: 1000
      update_queries:
  - index_name: "therapy_count"
    id_field: "participant_id"
    mapping:
      keyword:
        - type
        - study_short_name
        - study_id
        - ctep_disease_term
        - primary_diagnosis_disease_group
        - snomed_disease_code
        - tumor_grade
        - stage_of_disease
        - diagnosis_id
        - sex
        - race
        - ethnicity
        - carcinogen_exposure
        - targeted_therapy
        - targeted_therapy_id
        - targeted_therapy_string
        - best_response_to_targeted_therapy
        - anatomical_collection_site
        - tissue_category
        - assessment_timepoint
        - specimen_id
        - specimen_type
        - data_file_uuid
        - data_file_type
        - data_file_format
        - biospecimen_info.specimen_id
        - biospecimen_info.anatomical_collection_site
        - biospecimen_info.tissue_category
        - biospecimen_info.assessment_timepoint
        - file_info.data_file_uuid
        - file_info.data_file_type
        - file_info.data_file_format
        - participant_id
    query: |
      MATCH (study:study)<-[:belongs_to]-(sb:participant)
      WITH DISTINCT sb, study

      CALL {
        WITH sb, study
        OPTIONAL MATCH (sb)<-[:of_participant]-(tt:targeted_therapy)
        WITH
          COLLECT(DISTINCT CASE WHEN tt.targeted_therapy IS NOT NULL AND trim(toString(tt.targeted_therapy)) <> '' THEN tt.targeted_therapy ELSE null END) AS tt_names,
          COLLECT(DISTINCT CASE WHEN tt.targeted_therapy_id IS NOT NULL THEN tt.targeted_therapy_id ELSE null END) AS tt_ids,
          COLLECT(DISTINCT CASE WHEN tt.best_response_to_targeted_therapy IS NOT NULL AND toString(tt.best_response_to_targeted_therapy) <> '' THEN toString(tt.best_response_to_targeted_therapy) ELSE null END) AS responses
        WITH
          [x IN tt_names WHERE x IS NOT NULL] AS targeted_therapy,
          [x IN tt_ids WHERE x IS NOT NULL] AS targeted_therapy_id,
          [x IN responses WHERE x IS NOT NULL] AS best_response_to_targeted_therapy
        RETURN
          targeted_therapy,
          targeted_therapy_id,
          REDUCE(s = '', x IN targeted_therapy | s + CASE WHEN s = '' THEN '' ELSE '|' END + toString(x)) AS targeted_therapy_string,
          best_response_to_targeted_therapy
      }

      CALL {
        WITH sb, study
        OPTIONAL MATCH (spec_acs:specimen)-[:of_participant]->(sb)
        WITH COLLECT(DISTINCT CASE WHEN spec_acs.anatomical_collection_site IS NOT NULL AND spec_acs.anatomical_collection_site <> '' THEN toLower(trim(spec_acs.anatomical_collection_site)) ELSE null END) AS acs
        RETURN [s IN acs WHERE s IS NOT NULL] AS anatomical_collection_site
      }

      CALL {
        WITH sb, study
        OPTIONAL MATCH (demo:demographic)-[:of_participant]->(sb)
        WITH
          COLLECT(DISTINCT CASE WHEN demo.race IS NOT NULL AND demo.race <> '' THEN demo.race ELSE null END) AS races,
          COLLECT(DISTINCT CASE WHEN demo.sex IS NOT NULL AND demo.sex <> '' THEN demo.sex ELSE null END) AS sexes,
          COLLECT(DISTINCT CASE WHEN demo.ethnicity IS NOT NULL AND demo.ethnicity <> '' THEN demo.ethnicity ELSE null END) AS ethnicities
        RETURN
          [r IN races WHERE r IS NOT NULL] AS race,
          [s IN sexes WHERE s IS NOT NULL] AS sex,
          [e IN ethnicities WHERE e IS NOT NULL] AS ethnicity
      }

      OPTIONAL MATCH (spec:specimen)-[:of_participant]->(sb)
      OPTIONAL MATCH (sb)<-[*..2]-(file:file)
      OPTIONAL MATCH (diag:diagnosis)-[:of_participant]->(sb)
      OPTIONAL MATCH (expose:exposure)-[:of_participant]->(sb)
      OPTIONAL MATCH (ps:participant_status)-[:of_participant]->(sb)
      WITH sb, study, targeted_therapy, targeted_therapy_id, targeted_therapy_string,
        best_response_to_targeted_therapy, anatomical_collection_site, race, sex, ethnicity,
        spec, file, diag, expose, ps
      WHERE size(targeted_therapy) > 0

      RETURN DISTINCT
      'participants' AS type,
      sb.participant_id AS participant_id,
      COLLECT(DISTINCT study.study_short_name) AS study_short_name,
      COLLECT(DISTINCT toString(study.study_id)) AS study_id,
      COLLECT(DISTINCT diag.ctep_disease_term) AS ctep_disease_term,
      COLLECT(DISTINCT diag.primary_diagnosis_disease_group) AS primary_diagnosis_disease_group,
      COLLECT(DISTINCT diag.snomed_disease_code) AS snomed_disease_code,
      COLLECT(DISTINCT diag.tumor_grade) AS tumor_grade,
      COLLECT(DISTINCT diag.stage_of_disease) AS stage_of_disease,
      COLLECT(DISTINCT diag.diagnosis_id) AS diagnosis_id,
      sex,
      race,
      ethnicity,
      COLLECT(DISTINCT ps.survival_status) AS survival_status,
      COLLECT(DISTINCT expose.carcinogen_exposure) AS carcinogen_exposure,
      targeted_therapy,
      targeted_therapy_id,
      targeted_therapy_string,
      best_response_to_targeted_therapy,
      anatomical_collection_site,
      COLLECT(DISTINCT spec.tissue_category) AS tissue_category,
      COLLECT(DISTINCT spec.assessment_timepoint) AS assessment_timepoint,
      COLLECT(DISTINCT spec.specimen_id) AS specimen_id,
      COLLECT(DISTINCT COALESCE(spec.specimen_type, '')) AS specimen_type,
      COLLECT(DISTINCT file.data_file_type) AS data_file_type,
      COLLECT(DISTINCT file.data_file_uuid) AS data_file_uuid,
      COLLECT(DISTINCT file.data_file_format) AS data_file_format,
      COLLECT(DISTINCT {
        specimen_id: spec.specimen_id,
        anatomical_collection_site: spec.anatomical_collection_site,
        tissue_category: spec.tissue_category,
        assessment_timepoint: spec.assessment_timepoint
      }) AS biospecimen_info,
      [x IN COLLECT(DISTINCT {
        data_file_uuid: file.data_file_uuid,
        data_file_format: file.data_file_format,
        data_file_type: file.data_file_type
      }) WHERE x.data_file_uuid IS NOT NULL] AS file_info
      SKIP $skip LIMIT $limit
    page_size: 1000
  - index_name: "study_node_counts"
    id_field: "id"
    mapping:
      keyword:
        - id
        - short_name
        - node_label
      long:
        - participant_count
        - total_node_count
    query: |
      MATCH (study:study)<-[:belongs_to]-(p:participant)
      OPTIONAL MATCH (p)<-[:of_participant]-(diag:diagnosis)
      OPTIONAL MATCH (p)<-[:of_participant]-(spec:specimen)
      OPTIONAL MATCH (p)<-[:of_participant]-(demo:demographic)
      OPTIONAL MATCH (p)<-[:of_participant]-(exp:exposure)
      OPTIONAL MATCH (p)<-[:of_participant]-(surg:surgery)
      OPTIONAL MATCH (p)<-[:of_participant]-(tt:targeted_therapy)
      OPTIONAL MATCH (p)<-[:of_participant]-(nt:non_targeted_therapy)
      OPTIONAL MATCH (p)<-[:of_participant]-(rt:radiotherapy)
      WITH study, p,
        collect(DISTINCT diag) AS diags,
        collect(DISTINCT spec) AS specs,
        collect(DISTINCT demo) AS demos,
        collect(DISTINCT exp) AS exps,
        collect(DISTINCT surg) AS surgs,
        collect(DISTINCT tt) AS tts,
        collect(DISTINCT nt) AS nts,
        collect(DISTINCT rt) AS rts
      WITH study, p,
        [
          {label: 'diagnosis', nodeCount: size(diags), participant: CASE WHEN size(diags) > 0 THEN p ELSE null END},
          {label: 'specimen', nodeCount: size(specs), participant: CASE WHEN size(specs) > 0 THEN p ELSE null END},
          {label: 'demographic', nodeCount: size(demos), participant: CASE WHEN size(demos) > 0 THEN p ELSE null END},
          {label: 'exposure', nodeCount: size(exps), participant: CASE WHEN size(exps) > 0 THEN p ELSE null END},
          {label: 'surgery', nodeCount: size(surgs), participant: CASE WHEN size(surgs) > 0 THEN p ELSE null END},
          {label: 'radiotherapy', nodeCount: size(rts), participant: CASE WHEN size(rts) > 0 THEN p ELSE null END},
          {label: 'targeted_therapy', nodeCount: size(tts), participant: CASE WHEN size(tts) > 0 THEN p ELSE null END},
          {label: 'non_targeted_therapy', nodeCount: size(nts), participant: CASE WHEN size(nts) > 0 THEN p ELSE null END}
        ] AS rows
      UNWIND rows AS row
      WITH study, row.label AS node_label, row.nodeCount AS node_count, row.participant AS participant
      RETURN
        coalesce(study.study_short_name, '') + '|' + node_label AS id,
        study.study_short_name AS short_name,
        node_label,
        count(DISTINCT participant) AS participant_count,
        sum(node_count) AS total_node_count
      ORDER BY participant_count DESC
      SKIP $skip LIMIT $limit
    page_size: 1000
  - index_name: "clinical_data_tab"
    id_field: "study_id"
    mapping:
      keyword:
        - study_short_name
        - study_id
        - study_accession
        - unique_node_types
        - diagnosisNodeData.participant_ids
        - diagnosisNodeData.ctep_disease_term
        - diagnosisNodeData.date_of_diagnosis
        - diagnosisNodeData.date_of_diagnosis_original
        - diagnosisNodeData.date_of_diagnosis_unit
        - diagnosisNodeData.diagnosis_record_id
        - diagnosisNodeData.histological_subtype
        - diagnosisNodeData.histology
        - diagnosisNodeData.meddra_disease_code
        - diagnosisNodeData.primary_diagnosis_disease_group
        - diagnosisNodeData.primary_disease_site
        - diagnosisNodeData.snomed_disease_code
        - diagnosisNodeData.snomed_disease_term
        - diagnosisNodeData.UUID
        - demographicNodeData.participant_ids
        - demographicNodeData.age_at_enrollment
        - demographicNodeData.age_at_enrollment_original
        - demographicNodeData.age_at_enrollment_original_unit
        - demographicNodeData.age_at_enrollment_unit
        - demographicNodeData.body_surface_area
        - demographicNodeData.body_surface_area_original
        - demographicNodeData.body_surface_area_original_unit
        - demographicNodeData.body_surface_area_unit
        - demographicNodeData.demographic_record_id
        - demographicNodeData.ethnicity
        - demographicNodeData.height
        - demographicNodeData.height_original
        - demographicNodeData.height_original_unit
        - demographicNodeData.height_unit
        - demographicNodeData.ncbi_taxonomy_id
        - demographicNodeData.ncbi_taxonomy_name
        - demographicNodeData.race
        - demographicNodeData.sex
        - demographicNodeData.uuid
        - demographicNodeData.weight
        - demographicNodeData.weight_original
        - demographicNodeData.weight_original_unit
        - demographicNodeData.weight_unit
        - demographicNodeData.occupation
        - demographicNodeData.income
        - demographicNodeData.highest_level_of_education
        - exposureNodeData.participant_ids
        - exposureNodeData.carcinogen_exposure
        - exposureNodeData.exposure_record_id
        - specimenNodeData.participant_ids
        - specimenNodeData.anatomical_collection_site
        - specimenNodeData.assessment_timepoint
        - specimenNodeData.collection_date
        - specimenNodeData.collection_date_original
        - specimenNodeData.collection_date_original_unit
        - specimenNodeData.collection_date_unit
        - specimenNodeData.crdc_id
        - specimenNodeData.created
        - specimenNodeData.specimen_category
        - specimenNodeData.specimen_record_id
        - specimenNodeData.specimen_type_concept_code
        - specimenNodeData.tissue_category
        - participantStatusNodeData.participant_ids
        - participantStatusNodeData.off_study
        - participantStatusNodeData.off_study_reason
        - participantStatusNodeData.participant_status_record_id
        - participantStatusNodeData.survival_status
      long:
        - diagnosisNodeCount
        - diagnosisParticipantCount
        - demographicNodeCount
        - demographicParticipantCount
        - exposureNodeCount
        - exposureParticipantCount
        - specimenNodeCount
        - specimenParticipantCount
        - participantStatusNodeCount
        - participantStatusParticipantCount
    query: |
      MATCH (study:study)
      OPTIONAL MATCH (study)<-[:belongs_to]-(p_diag:participant)<-[:of_participant]-(diag:diagnosis)
      WITH study, COLLECT(DISTINCT {node: diag, participant_id: p_diag.participant_id}) AS diag_data
      OPTIONAL MATCH (study)<-[:belongs_to]-(p_demo:participant)<-[:of_participant]-(demo:demographic)
      WITH study, diag_data, COLLECT(DISTINCT {node: demo, participant_id: p_demo.participant_id}) AS demo_data
      OPTIONAL MATCH (study)<-[:belongs_to]-(p_exp:participant)<-[:of_participant]-(exp:exposure)
      WITH study, diag_data, demo_data, COLLECT(DISTINCT {node: exp, participant_id: p_exp.participant_id}) AS exp_data
      OPTIONAL MATCH (study)<-[:belongs_to]-(p_spec:participant)<-[:of_participant]-(spec:specimen)
      WITH study, diag_data, demo_data, exp_data, COLLECT(DISTINCT {node: spec, participant_id: p_spec.participant_id}) AS spec_data
      OPTIONAL MATCH (study)<-[:belongs_to]-(p_ps:participant)<-[:of_participant]-(ps:participant_status)
      WITH study, diag_data, demo_data, exp_data, spec_data, COLLECT(DISTINCT {node: ps, participant_id: p_ps.participant_id}) AS ps_data
      WITH study,
        [x IN diag_data WHERE x.node IS NOT NULL | {
          participant_ids: COALESCE(x.participant_id, ''),
          ctep_disease_term: x.node.ctep_disease_term,
          date_of_diagnosis: x.node.date_of_diagnosis,
          date_of_diagnosis_original: x.node.date_of_diagnosis_original,
          date_of_diagnosis_unit: x.node.date_of_diagnosis_unit,
          diagnosis_record_id: x.node.diagnosis_record_id,
          histological_subtype: x.node.histological_subtype,
          histology: x.node.histology,
          meddra_disease_code: x.node.meddra_disease_code,
          primary_diagnosis_disease_group: x.node.primary_diagnosis_disease_group,
          primary_disease_site: x.node.primary_disease_site,
          snomed_disease_code: x.node.snomed_disease_code,
          snomed_disease_term: x.node.snomed_disease_term,
          UUID: x.node.uuid
        }] AS diagnosisNodeData,
        size(REDUCE(a = [], p IN [x IN diag_data WHERE x.node IS NOT NULL AND x.participant_id IS NOT NULL | x.participant_id] | CASE WHEN p IN a THEN a ELSE a + p END)) AS diagnosisParticipantCount,
        [x IN demo_data WHERE x.node IS NOT NULL | {
          participant_ids: COALESCE(x.participant_id, ''),
          age_at_enrollment: x.node.age_at_enrollment,
          age_at_enrollment_original: x.node.age_at_enrollment_original,
          age_at_enrollment_original_unit: x.node.age_at_enrollment_original_unit,
          age_at_enrollment_unit: x.node.age_at_enrollment_unit,
          body_surface_area: x.node.body_surface_area,
          body_surface_area_original: x.node.body_surface_area_original,
          body_surface_area_original_unit: x.node.body_surface_area_original_unit,
          body_surface_area_unit: x.node.body_surface_area_unit,
          demographic_record_id: x.node.demographic_record_id,
          ethnicity: x.node.ethnicity,
          height: x.node.height,
          height_original: x.node.height_original,
          height_original_unit: x.node.height_original_unit,
          height_unit: x.node.height_unit,
          ncbi_taxonomy_id: x.node.ncbi_taxonomy_id,
          ncbi_taxonomy_name: x.node.ncbi_taxonomy_name,
          race: x.node.race,
          sex: x.node.sex,
          uuid: x.node.uuid,
          weight: x.node.weight,
          weight_original: x.node.weight_original,
          weight_original_unit: x.node.weight_original_unit,
          weight_unit: x.node.weight_unit,
          occupation: x.node.occupation,
          income: x.node.income,
          highest_level_of_education: x.node.highest_level_of_education
        }] AS demographicNodeData,
        size(REDUCE(a = [], p IN [x IN demo_data WHERE x.node IS NOT NULL AND x.participant_id IS NOT NULL | x.participant_id] | CASE WHEN p IN a THEN a ELSE a + p END)) AS demographicParticipantCount,
        [x IN exp_data WHERE x.node IS NOT NULL | {
          participant_ids: COALESCE(x.participant_id, ''),
          carcinogen_exposure: x.node.carcinogen_exposure,
          exposure_record_id: x.node.exposure_record_id
        }] AS exposureNodeData,
        size(REDUCE(a = [], p IN [x IN exp_data WHERE x.node IS NOT NULL AND x.participant_id IS NOT NULL | x.participant_id] | CASE WHEN p IN a THEN a ELSE a + p END)) AS exposureParticipantCount,
        [x IN spec_data WHERE x.node IS NOT NULL | {
          participant_ids: COALESCE(x.participant_id, ''),
          anatomical_collection_site: x.node.anatomical_collection_site,
          assessment_timepoint: toString(x.node.assessment_timepoint),
          collection_date: toString(x.node.collection_date),
          collection_date_original: toString(x.node.collection_date_original),
          collection_date_original_unit: x.node.collection_date_original_unit,
          collection_date_unit: toString(x.node.collection_date_unit),
          crdc_id: x.node.crdc_id,
          created: toString(x.node.created),
          specimen_category: x.node.specimen_category,
          specimen_record_id: x.node.specimen_record_id,
          specimen_type_concept_code: x.node.specimen_type_concept_code,
          tissue_category: x.node.tissue_category
        }] AS specimenNodeData,
        size(REDUCE(a = [], p IN [x IN spec_data WHERE x.node IS NOT NULL AND x.participant_id IS NOT NULL | x.participant_id] | CASE WHEN p IN a THEN a ELSE a + p END)) AS specimenParticipantCount,
        [x IN ps_data WHERE x.node IS NOT NULL | {
          participant_ids: COALESCE(x.participant_id, ''),
          off_study: x.node.off_study,
          off_study_reason: x.node.off_study_reason,
          participant_status_record_id: x.node.participant_status_record_id,
          survival_status: x.node.survival_status
        }] AS participantStatusNodeData,
        size(REDUCE(a = [], p IN [x IN ps_data WHERE x.node IS NOT NULL AND x.participant_id IS NOT NULL | x.participant_id] | CASE WHEN p IN a THEN a ELSE a + p END)) AS participantStatusParticipantCount,
        ['diagnosis','demographic','exposure','specimen','participant_status'] AS unique_node_types
      RETURN
        study.study_short_name AS study_short_name,
        toString(study.study_id) AS study_id,
        study.study_accession AS study_accession,
        unique_node_types,
        diagnosisNodeData,
        size([d IN diagnosisNodeData WHERE d.diagnosis_record_id IS NOT NULL]) AS diagnosisNodeCount,
        diagnosisParticipantCount,
        demographicNodeData,
        size([d IN demographicNodeData WHERE d.demographic_record_id IS NOT NULL]) AS demographicNodeCount,
        demographicParticipantCount,
        exposureNodeData,
        size([e IN exposureNodeData WHERE e.exposure_record_id IS NOT NULL]) AS exposureNodeCount,
        exposureParticipantCount,
        specimenNodeData,
        size([s IN specimenNodeData WHERE s.specimen_record_id IS NOT NULL]) AS specimenNodeCount,
        specimenParticipantCount,
        participantStatusNodeData,
        size([p IN participantStatusNodeData WHERE p.participant_status_record_id IS NOT NULL]) AS participantStatusNodeCount,
        participantStatusParticipantCount
      SKIP $skip LIMIT $limit
    page_size: 1000
  - index_name: "clinical_trial_data_tab"
    id_field: "study_id"
    mapping:
      keyword:
        - study_short_name
        - study_id
        - study_accession
        - targetedTherapyNodeData.participant_ids
        - targetedTherapyNodeData.targeted_therapy
        - targetedTherapyNodeData.targeted_therapy_dose
        - targetedTherapyNodeData.targeted_therapy_frequency
        - targetedTherapyNodeData.targeted_therapy_record_id
        - nonTargetedTherapyNodeData.participant_ids
        - nonTargetedTherapyNodeData.non_targeted_therapy_record_id
        - nonTargetedTherapyNodeData.best_response_to_non_targeted_therapy
        - nonTargetedTherapyNodeData.non_targeted_therapy
        - nonTargetedTherapyNodeData.non_targeted_therapy_dose
        - nonTargetedTherapyNodeData.non_targeted_therapy_frequency
        - radiotherapyNodeData.participant_ids
        - radiotherapyNodeData.radiation_dose
        - radiotherapyNodeData.radiation_extent
        - radiotherapyNodeData.radiation_frequency
        - radiotherapyNodeData.radiological_procedure
        - radiotherapyNodeData.radiological_procedure_anatomical_location
        - radiotherapyNodeData.radiological_procedure_record_id
        - radiotherapyNodeData.uuid
        - surgeryNodeData.participant_ids
        - surgeryNodeData.extent_of_residual_disease
        - surgeryNodeData.surgical_procedure
        - surgeryNodeData.surgical_procedure_anatomical_location
        - surgeryNodeData.surgical_procedure_date
        - surgeryNodeData.surgical_procedure_findings
        - surgeryNodeData.surgical_procedure_record_id
        - surgeryNodeData.surgical_procedure_therapeutic
      long:
        - targetedTherapyNodeCount
        - targetedTherapyParticipantCount
        - nonTargetedTherapyNodeCount
        - nonTargetedTherapyParticipantCount
        - radiotherapyNodeCount
        - radiotherapyParticipantCount
        - surgeryNodeCount
        - surgeryParticipantCount
    query: |
      MATCH (study:study)
      OPTIONAL MATCH (study)<-[:belongs_to]-(p_tt:participant)<-[:of_participant]-(tt:targeted_therapy)
      WITH study, COLLECT(DISTINCT {node: tt, participant_id: p_tt.participant_id}) AS tt_data
      OPTIONAL MATCH (study)<-[:belongs_to]-(p_nt:participant)<-[:of_participant]-(nt:non_targeted_therapy)
      WITH study, tt_data, COLLECT(DISTINCT {node: nt, participant_id: p_nt.participant_id}) AS nt_data
      OPTIONAL MATCH (study)<-[:belongs_to]-(p_rt:participant)<-[:of_participant]-(rt:radiotherapy)
      WITH study, tt_data, nt_data, COLLECT(DISTINCT {node: rt, participant_id: p_rt.participant_id}) AS rt_data
      OPTIONAL MATCH (study)<-[:belongs_to]-(p_surg:participant)<-[:of_participant]-(surg:surgery)
      WITH study, tt_data, nt_data, rt_data, COLLECT(DISTINCT {node: surg, participant_id: p_surg.participant_id}) AS surg_data
      WITH study,
        [x IN tt_data WHERE x.node IS NOT NULL | {
          participant_ids: COALESCE(x.participant_id, ''),
          targeted_therapy: x.node.targeted_therapy,
          targeted_therapy_dose: x.node.targeted_therapy_dose,
          targeted_therapy_frequency: toString(x.node.targeted_therapy_frequency),
          targeted_therapy_record_id: x.node.targeted_therapy_record_id
        }] AS targetedTherapyNodeData,
        size(REDUCE(a = [], p IN [x IN tt_data WHERE x.node IS NOT NULL AND x.participant_id IS NOT NULL | x.participant_id] | CASE WHEN p IN a THEN a ELSE a + p END)) AS targetedTherapyParticipantCount,
        [x IN nt_data WHERE x.node IS NOT NULL | {
          participant_ids: COALESCE(x.participant_id, ''),
          non_targeted_therapy_record_id: x.node.non_targeted_therapy_record_id,
          best_response_to_non_targeted_therapy: toString(COALESCE(x.node.best_response_to_non_targeted_therapy, '')),
          non_targeted_therapy: toString(COALESCE(x.node.non_targeted_therapy, '')),
          non_targeted_therapy_dose: toString(COALESCE(x.node.non_targeted_therapy_dose, '')),
          non_targeted_therapy_frequency: toString(COALESCE(x.node.non_targeted_therapy_frequency, ''))
        }] AS nonTargetedTherapyNodeData,
        size(REDUCE(a = [], p IN [x IN nt_data WHERE x.node IS NOT NULL AND x.participant_id IS NOT NULL | x.participant_id] | CASE WHEN p IN a THEN a ELSE a + p END)) AS nonTargetedTherapyParticipantCount,
        [x IN rt_data WHERE x.node IS NOT NULL | {
          participant_ids: COALESCE(x.participant_id, ''),
          radiation_dose: x.node.radiation_dose,
          radiation_extent: x.node.radiation_extent,
          radiation_frequency: x.node.radiation_frequency,
          radiological_procedure: x.node.radiological_procedure,
          radiological_procedure_anatomical_location: x.node.radiological_procedure_anatomical_location,
          radiological_procedure_record_id: x.node.radiological_procedure_record_id,
          uuid: x.node.uuid
        }] AS radiotherapyNodeData,
        size(REDUCE(a = [], p IN [x IN rt_data WHERE x.node IS NOT NULL AND x.participant_id IS NOT NULL | x.participant_id] | CASE WHEN p IN a THEN a ELSE a + p END)) AS radiotherapyParticipantCount,
        [x IN surg_data WHERE x.node IS NOT NULL | {
          participant_ids: COALESCE(x.participant_id, ''),
          extent_of_residual_disease: x.node.extent_of_residual_disease,
          surgical_procedure: x.node.surgical_procedure,
          surgical_procedure_anatomical_location: x.node.surgical_procedure_anatomical_location,
          surgical_procedure_date: toString(x.node.surgical_procedure_date),
          surgical_procedure_findings: x.node.surgical_procedure_findings,
          surgical_procedure_record_id: x.node.surgical_procedure_record_id,
          surgical_procedure_therapeutic: x.node.surgical_procedure_therapeutic
        }] AS surgeryNodeData,
        size(REDUCE(a = [], p IN [x IN surg_data WHERE x.node IS NOT NULL AND x.participant_id IS NOT NULL | x.participant_id] | CASE WHEN p IN a THEN a ELSE a + p END)) AS surgeryParticipantCount
      WITH toString(study.study_id) AS study_id, COLLECT({
        study_short_name: study.study_short_name,
        study_accession: study.study_accession,
        targetedTherapyNodeData: targetedTherapyNodeData,
        targetedTherapyParticipantCount: targetedTherapyParticipantCount,
        nonTargetedTherapyNodeData: nonTargetedTherapyNodeData,
        nonTargetedTherapyParticipantCount: nonTargetedTherapyParticipantCount,
        radiotherapyNodeData: radiotherapyNodeData,
        radiotherapyParticipantCount: radiotherapyParticipantCount,
        surgeryNodeData: surgeryNodeData,
        surgeryParticipantCount: surgeryParticipantCount
      }) AS rows
      WITH study_id, head(rows) AS r
      RETURN
        r.study_short_name AS study_short_name,
        study_id AS study_id,
        r.study_accession AS study_accession,
        r.targetedTherapyNodeData AS targetedTherapyNodeData,
        size([t IN r.targetedTherapyNodeData WHERE t.targeted_therapy_record_id IS NOT NULL]) AS targetedTherapyNodeCount,
        r.targetedTherapyParticipantCount AS targetedTherapyParticipantCount,
        r.nonTargetedTherapyNodeData AS nonTargetedTherapyNodeData,
        size([n IN r.nonTargetedTherapyNodeData WHERE n.non_targeted_therapy_record_id IS NOT NULL]) AS nonTargetedTherapyNodeCount,
        r.nonTargetedTherapyParticipantCount AS nonTargetedTherapyParticipantCount,
        r.radiotherapyNodeData AS radiotherapyNodeData,
        size([n IN r.radiotherapyNodeData WHERE n.radiological_procedure_record_id IS NOT NULL]) AS radiotherapyNodeCount,
        r.radiotherapyParticipantCount AS radiotherapyParticipantCount,
        r.surgeryNodeData AS surgeryNodeData,
        size([n IN r.surgeryNodeData WHERE n.surgical_procedure_record_id IS NOT NULL]) AS surgeryNodeCount,
        r.surgeryParticipantCount AS surgeryParticipantCount
      SKIP $skip LIMIT $limit
    page_size: 1000
  - index_name: "tab_participants"
    id_field: "participant_id"
    mapping:
      keyword:
        - type
        - participant_id
        - study_short_name
        - study_id
        - study_accession
        - study_name
        - study_type
        - study_description
        - dates_of_conduct
        - ctep_disease_term
        - primary_diagnosis_disease_group
        - stage_of_disease
        - tumor_grade
        - survival_status
        - sex
        - race
        - ethnicity
        - carcinogen_exposure
        - targeted_therapy
        - best_response_to_targeted_therapy
        - targeted_therapy_string
        - anatomical_collection_site
        - specimen_id
        - specimen_type
        - tissue_category
        - assessment_timepoint
        - data_file_uuid
        - data_file_type
        - data_file_format
        - surgical_procedure
        - surgical_procedure_anatomical_location
        - surgical_procedure_date
        - surgical_procedure_findings
        - surgical_procedure_id
        - surgical_procedure_therapeutic
        - extent_of_residual_disease
    data_files:
      type: nested
      properties:
        data_file_uuid:
          type: keyword
        data_file_name:
          type: keyword
        data_file_type:
          type: keyword
        data_file_description:
          type: keyword
        data_file_format:
          type: keyword
        data_file_size:
          type: double
        data_file_checksum_value:
          type: keyword
        data_file_checksum_type:
          type: keyword
        data_file_compression_status:
          type: keyword
        data_file_location:
          type: keyword
    long:
    - age_at_enrollment
    initial_query:
    query: |
      MATCH (study:study)<-[:belongs_to]-(sb:participant)
      OPTIONAL MATCH (sb)<-[:of_participant]-(d:diagnosis)
      WITH study, sb, d
      ORDER BY coalesce(datetime(d.updated), datetime(d.created)) DESC, id(d) DESC
      WITH study, sb, head(collect(d)) AS d_latest

      OPTIONAL MATCH (sb)<-[:of_participant]-(e:exposure)
      WITH study, sb, d_latest, e
      ORDER BY coalesce(datetime(e.updated), datetime(e.created)) DESC, id(e) DESC
      WITH study, sb, d_latest, head(collect(e)) AS e_latest

      OPTIONAL MATCH (sb)<-[:of_participant]-(tt:targeted_therapy)
      WITH study, sb, d_latest, e_latest, collect(tt) AS tts
      WITH study, sb, d_latest, e_latest,
        [x IN [t IN tts
          WHERE t.targeted_therapy IS NOT NULL AND trim(toString(t.targeted_therapy)) <> ''
          | CASE
              WHEN toLower(trim(toString(t.targeted_therapy))) = 'not reported' THEN 'Not reported'
              ELSE trim(toString(t.targeted_therapy))
            END
        ] WHERE x IS NOT NULL] AS targeted_therapy,
        [x IN [t IN tts
          WHERE t.best_response_to_targeted_therapy IS NOT NULL AND trim(toString(t.best_response_to_targeted_therapy)) <> ''
          | trim(toString(t.best_response_to_targeted_therapy))
        ] WHERE x IS NOT NULL] AS best_response_to_targeted_therapy
      WITH study, sb, d_latest, e_latest, targeted_therapy, best_response_to_targeted_therapy,
        CASE
          WHEN size(targeted_therapy) > 0 THEN REDUCE(s = '', x IN targeted_therapy | s + CASE WHEN s = '' THEN '' ELSE '|' END + x)
          ELSE null
        END AS targeted_therapy_string

      OPTIONAL MATCH (sb)<-[:of_participant]-(sp:specimen)
      WITH study, sb, d_latest, e_latest, targeted_therapy, best_response_to_targeted_therapy, targeted_therapy_string, sp
      WITH study, sb, d_latest, e_latest, targeted_therapy, best_response_to_targeted_therapy, targeted_therapy_string,
        [s IN collect(CASE WHEN sp.anatomical_collection_site IS NOT NULL AND toString(sp.anatomical_collection_site) <> '' THEN trim(toLower(toString(sp.anatomical_collection_site))) ELSE null END) WHERE s IS NOT NULL] AS anatomical_collection_site,
        collect(DISTINCT sp.specimen_id) AS specimen_id,
        collect(DISTINCT sp.specimen_type) AS specimen_type,
        collect(DISTINCT sp.tissue_category) AS tissue_category,
        collect(DISTINCT sp.assessment_timepoint) AS assessment_timepoint

      OPTIONAL MATCH (sb)<-[:of_participant]-(dm:demographic)
      WITH study, sb, d_latest, e_latest, targeted_therapy, best_response_to_targeted_therapy, targeted_therapy_string, anatomical_collection_site,
        specimen_id, specimen_type, tissue_category, assessment_timepoint, dm
      ORDER BY coalesce(datetime(dm.updated), datetime(dm.created)) DESC, id(dm) DESC
      WITH study, sb, d_latest, e_latest, targeted_therapy, best_response_to_targeted_therapy, targeted_therapy_string, anatomical_collection_site,
        specimen_id, specimen_type, tissue_category, assessment_timepoint, head(collect(dm)) AS demo_latest

      OPTIONAL MATCH (sb)<-[:of_participant]-(ps:participant_status)
      WITH study, sb, d_latest, e_latest, targeted_therapy, best_response_to_targeted_therapy, targeted_therapy_string, anatomical_collection_site,
        specimen_id, specimen_type, tissue_category, assessment_timepoint, demo_latest, ps
      ORDER BY coalesce(datetime(ps.updated), datetime(ps.created)) DESC, id(ps) DESC
      WITH study, sb, d_latest, e_latest, targeted_therapy, best_response_to_targeted_therapy, targeted_therapy_string, anatomical_collection_site,
        specimen_id, specimen_type, tissue_category, assessment_timepoint, demo_latest, head(collect(ps)) AS ps_latest

      OPTIONAL MATCH (sb)<-[*..2]-(df:file)
      OPTIONAL MATCH (study)<-[:associated_with]-(study_zip_file:file)
      WHERE toLower(coalesce(study_zip_file.data_file_format, '')) = 'zip'
        AND NOT (study_zip_file)--(:participant)
        AND NOT (study_zip_file)-[:associated_with]->(:specimen)

      WITH study, sb, d_latest, e_latest, targeted_therapy, best_response_to_targeted_therapy, targeted_therapy_string, anatomical_collection_site,
        specimen_id, specimen_type, tissue_category, assessment_timepoint, demo_latest, ps_latest, df, study_zip_file
      ORDER BY coalesce(sb.participant_id, '') ASC

      RETURN DISTINCT
        'participant' AS type,
        sb.participant_id AS participant_id,
        study.study_short_name AS study_short_name,
        study.study_id AS study_id,
        study.study_accession AS study_accession,
        study.study_name AS study_name,
        study.study_type AS study_type,
        study.study_description AS study_description,
        study.dates_of_conduct AS dates_of_conduct,
        d_latest.ctep_disease_term AS ctep_disease_term,
        d_latest.primary_diagnosis_disease_group AS primary_diagnosis_disease_group,
        d_latest.stage_of_disease AS stage_of_disease,
        d_latest.tumor_grade AS tumor_grade,
        ps_latest.survival_status AS survival_status,
        demo_latest.age_at_enrollment AS age_at_enrollment,
        demo_latest.sex AS sex,
        demo_latest.race AS race,
        demo_latest.ethnicity AS ethnicity,
        COALESCE(e_latest.carcinogen_exposure, '') AS carcinogen_exposure,
        targeted_therapy,
        best_response_to_targeted_therapy,
        targeted_therapy_string,
        anatomical_collection_site,
        specimen_id,
        specimen_type,
        tissue_category,
        assessment_timepoint,
        [x IN COLLECT(DISTINCT df.data_file_type) + COLLECT(DISTINCT study_zip_file.data_file_type) WHERE x IS NOT NULL] AS data_file_type,
        [x IN COLLECT(DISTINCT df.data_file_uuid) + COLLECT(DISTINCT study_zip_file.data_file_uuid) WHERE x IS NOT NULL] AS data_file_uuid,
        [x IN COLLECT(DISTINCT df.data_file_format) + COLLECT(DISTINCT study_zip_file.data_file_format) WHERE x IS NOT NULL] AS data_file_format,
        [x IN COLLECT(DISTINCT {
          data_file_uuid: df.data_file_uuid,
          data_file_name: df.data_file_name,
          data_file_type: df.data_file_type,
          data_file_description: df.data_file_description,
          data_file_format: df.data_file_format,
          data_file_size: df.data_file_size,
          data_file_checksum_value: df.data_file_checksum_value,
          data_file_checksum_type: df.data_file_checksum_type,
          data_file_compression_status: df.data_file_compression_status,
          data_file_location: df.data_file_location
        }) WHERE x.data_file_uuid IS NOT NULL] +
        [x IN COLLECT(DISTINCT {
          data_file_uuid: study_zip_file.data_file_uuid,
          data_file_name: study_zip_file.data_file_name,
          data_file_type: study_zip_file.data_file_type,
          data_file_description: study_zip_file.data_file_description,
          data_file_format: study_zip_file.data_file_format,
          data_file_size: study_zip_file.data_file_size,
          data_file_checksum_value: study_zip_file.data_file_checksum_value,
          data_file_checksum_type: study_zip_file.data_file_checksum_type,
          data_file_compression_status: study_zip_file.data_file_compression_status,
          data_file_location: study_zip_file.data_file_location
      }) WHERE x.data_file_uuid IS NOT NULL] AS data_files
    page_size: 10000
  - index_name: "tab_biospecimens"
    id_field: "specimen_record_id"
    mapping:
      keyword:
        - type
        - participant_id
        - ctep_disease_term
        - stage_of_disease
        - primary_disease_site
        - primary_diagnosis_disease_group
        - specimen_record_id
        - specimen_type
        - specimen_category
        - anatomical_collection_site
        - tissue_category
        - assessment_timepoint
        - study_short_name
        - study_id
        - study_accession
        - data_files.data_file_uuid
        - data_files.data_file_name
        - data_files.data_file_type
        - data_files.data_file_description
        - data_files.data_file_format
        - data_files.data_file_checksum_value
        - data_files.data_file_checksum_type
        - data_files.data_file_compression_status
        - data_files.data_file_location
        - biospecimen_info.specimen_record_id
        - biospecimen_info.specimen_category
        - biospecimen_info.anatomical_collection_site
        - biospecimen_info.specimen_type
        - biospecimen_info.tissue_category
        - biospecimen_info.assessment_timepoint
        - data_file_uuid
        - tumor_grade
        - survival_status
        - sex
        - race
        - ethnicity
        - carcinogen_exposure
        - targeted_therapy
        - targeted_therapy_string
        - data_file_type
        - data_file_format
      long:
        - data_files.data_file_size
    query: |
      MATCH (spec:specimen)-[:of_participant]->(sub:participant)
      OPTIONAL MATCH (study:study)<-[:belongs_to]-(sub)
      WITH spec, sub, study, trim(toLower(COALESCE(spec.anatomical_collection_site, ''))) AS acs_norm

      OPTIONAL MATCH (sub)<-[:of_participant]-(d:diagnosis)
      WITH spec, sub, study, acs_norm, d
      ORDER BY id(d) DESC
      WITH spec, sub, study, acs_norm, head(collect(d)) AS best_diag

      OPTIONAL MATCH (sub)<-[:of_participant]-(ps:participant_status)
      WITH spec, sub, study, acs_norm, best_diag, ps
      ORDER BY coalesce(datetime(ps.updated), datetime(ps.created)) DESC, id(ps) DESC
      WITH spec, sub, study, acs_norm, best_diag, head(collect(ps)) AS ps_latest

      OPTIONAL MATCH (sub)<-[:of_participant]-(tt:targeted_therapy)
      WITH spec, sub, study, acs_norm, best_diag, ps_latest, collect(tt.targeted_therapy) AS ts
      WITH spec, sub, study, acs_norm, best_diag, ps_latest,
        [x IN [t IN ts
          WHERE t IS NOT NULL AND trim(toString(t)) <> ''
          | trim(toString(t))
        ] WHERE x IS NOT NULL] AS raw_targeted_therapy
      WITH spec, sub, study, acs_norm, best_diag, ps_latest,
        REDUCE(dedup = [], x IN raw_targeted_therapy |
          CASE WHEN x IN dedup THEN dedup ELSE dedup + x END
        ) AS dedup_targeted_therapy
      WITH spec, sub, study, acs_norm, best_diag, ps_latest,
        CASE
          WHEN size(dedup_targeted_therapy) > 1
            AND size([x IN dedup_targeted_therapy WHERE toLower(x) <> 'not reported']) > 0
          THEN [x IN dedup_targeted_therapy WHERE toLower(x) <> 'not reported']
          ELSE dedup_targeted_therapy
        END AS targeted_therapy
      WITH spec, sub, study, acs_norm, best_diag, ps_latest, targeted_therapy,
        CASE
          WHEN size(targeted_therapy) > 0
          THEN REDUCE(result = '', item IN targeted_therapy | result + CASE WHEN result = '' THEN '' ELSE '|' END + item)
          ELSE null
        END AS targeted_therapy_string

      OPTIONAL MATCH (sub)<-[:of_participant]-(demo:demographic)
      WITH spec, sub, study, acs_norm, best_diag, ps_latest, targeted_therapy, targeted_therapy_string, demo
      ORDER BY coalesce(datetime(demo.updated), datetime(demo.created)) DESC, id(demo) DESC
      WITH spec, sub, study, acs_norm, best_diag, ps_latest, targeted_therapy, targeted_therapy_string, head(collect(demo)) AS demo_latest

      OPTIONAL MATCH (sub)<-[:of_participant]-(exp:exposure)
      WITH spec, sub, study, acs_norm, best_diag, ps_latest, targeted_therapy, targeted_therapy_string, demo_latest,
        collect(DISTINCT exp.carcinogen_exposure) AS carcinogen_exposure

      OPTIONAL MATCH (sub)<-[*..2]-(df:file)
      OPTIONAL MATCH (study)<-[:associated_with]-(study_zip_file:file)
      WHERE toLower(coalesce(study_zip_file.data_file_format, '')) = 'zip'
        AND NOT (study_zip_file)--(:participant)
        AND NOT (study_zip_file)-[:associated_with]->(:specimen)

      WITH spec, sub, study, acs_norm, best_diag, ps_latest, targeted_therapy, targeted_therapy_string, demo_latest,
        carcinogen_exposure, df, study_zip_file
      ORDER BY coalesce(spec.specimen_record_id, '') ASC

      RETURN DISTINCT
        'biospecimen' AS type,
        sub.participant_id AS participant_id,
        best_diag.ctep_disease_term AS ctep_disease_term,
        best_diag.stage_of_disease AS stage_of_disease,
        best_diag.primary_disease_site AS primary_disease_site,
        best_diag.primary_diagnosis_disease_group AS primary_diagnosis_disease_group,
        spec.specimen_record_id AS specimen_record_id,
        spec.specimen_type AS specimen_type,
        spec.specimen_category AS specimen_category,
        acs_norm AS anatomical_collection_site,
        spec.tissue_category AS tissue_category,
        spec.assessment_timepoint AS assessment_timepoint,
        study.study_short_name AS study_short_name,
        toString(study.study_id) AS study_id,
        study.study_accession AS study_accession,
        [x IN COLLECT(DISTINCT {
          data_file_uuid: df.data_file_uuid,
          data_file_name: df.data_file_name,
          data_file_type: df.data_file_type,
          data_file_description: df.data_file_description,
          data_file_format: df.data_file_format,
          data_file_size: df.data_file_size,
          data_file_checksum_value: df.data_file_checksum_value,
          data_file_checksum_type: df.data_file_checksum_type,
          data_file_compression_status: df.data_file_compression_status,
          data_file_location: df.data_file_location
        }) WHERE x.data_file_uuid IS NOT NULL] +
        [x IN COLLECT(DISTINCT {
          data_file_uuid: study_zip_file.data_file_uuid,
          data_file_name: study_zip_file.data_file_name,
          data_file_type: study_zip_file.data_file_type,
          data_file_description: study_zip_file.data_file_description,
          data_file_format: study_zip_file.data_file_format,
          data_file_size: study_zip_file.data_file_size,
          data_file_checksum_value: study_zip_file.data_file_checksum_value,
          data_file_checksum_type: study_zip_file.data_file_checksum_type,
          data_file_compression_status: study_zip_file.data_file_compression_status,
          data_file_location: study_zip_file.data_file_location
        }) WHERE x.data_file_uuid IS NOT NULL] AS data_files,
        COLLECT(DISTINCT {
          specimen_record_id: spec.specimen_record_id,
          specimen_category: spec.specimen_category,
          anatomical_collection_site: acs_norm,
          specimen_type: spec.specimen_type,
          tissue_category: spec.tissue_category,
          assessment_timepoint: spec.assessment_timepoint
        }) AS biospecimen_info,
        [x IN COLLECT(DISTINCT df.data_file_uuid) + COLLECT(DISTINCT study_zip_file.data_file_uuid) WHERE x IS NOT NULL] AS data_file_uuid,
        best_diag.tumor_grade AS tumor_grade,
        ps_latest.survival_status AS survival_status,
        demo_latest.sex AS sex,
        demo_latest.race AS race,
        demo_latest.ethnicity AS ethnicity,
        carcinogen_exposure,
        targeted_therapy,
        targeted_therapy_string,
        [x IN COLLECT(DISTINCT df.data_file_type) + COLLECT(DISTINCT study_zip_file.data_file_type) WHERE x IS NOT NULL] AS data_file_type,
        [x IN COLLECT(DISTINCT df.data_file_format) + COLLECT(DISTINCT study_zip_file.data_file_format) WHERE x IS NOT NULL] AS data_file_format
      SKIP $skip LIMIT $limit
    page_size: 10000
  - index_name: "tab_data_files"
    id_field: "data_file_uuid"
    mapping:
