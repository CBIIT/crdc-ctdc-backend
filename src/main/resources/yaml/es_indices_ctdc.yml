        - biospecimen_info.specimen_record_id
        - biospecimen_info.specimen_id
        - biospecimen_info.anatomical_collection_site
        - biospecimen_info.specimen_type
        - biospecimen_info.tissue_category
        - biospecimen_info.assessment_timepoint
        - file_info.data_file_uuid
        - file_info.data_file_format
        - file_info.data_file_type
      long:
        - data_file_size
        - age_at_enrollment
    query: |
      MATCH (f:file)
      OPTIONAL MATCH (f)-[:associated_with]-(:study)
      WITH f, count(*) > 0 AS has_study
      OPTIONAL MATCH (f)-[:associated_with]-(:participant)
      WITH f, has_study, count(*) > 0 AS has_participant
      OPTIONAL MATCH (f)-[:associated_with]-(:specimen)-[:of_participant]->(:participant)
      WITH f, has_study, has_participant, count(*) > 0 AS has_biospecimen
      WITH f, [x IN [
        CASE WHEN has_study AND NOT has_participant AND NOT has_biospecimen THEN 'study' ELSE null END,
        CASE WHEN has_participant AND NOT has_biospecimen THEN 'participant' ELSE null END,
        CASE WHEN has_biospecimen THEN 'biospecimen' ELSE null END
      ] WHERE x IS NOT NULL] AS raw_associations
      WHERE size(raw_associations) > 0
      WITH f,
        CASE
          WHEN 'study' IN raw_associations
            AND NOT 'participant' IN raw_associations
            AND NOT 'biospecimen' IN raw_associations
          THEN ['study']
          ELSE [a IN raw_associations WHERE a <> 'study']
        END AS associations

      MATCH (study:study)-[:associated_with]-(f)
      OPTIONAL MATCH (study)<-[:belongs_to]-(sb0:participant)
      WITH f, study, associations, sb0
      ORDER BY sb0.participant_id
      WITH f, study, associations, head(collect(sb0)) AS sb

      OPTIONAL MATCH (sb)<-[:of_participant]-(spec0:specimen)
      WITH f, study, associations, sb, spec0
      ORDER BY id(spec0) DESC
      WITH f, study, associations, sb, head(collect(spec0)) AS spec

      OPTIONAL MATCH (sb)<-[:of_participant]-(diag0:diagnosis)
      WITH f, study, associations, sb, spec, diag0
      ORDER BY id(diag0) DESC
      WITH f, study, associations, sb, spec, head(collect(diag0)) AS diag

      OPTIONAL MATCH (sb)<-[:of_participant]-(demo0:demographic)
      WITH f, study, associations, sb, spec, diag, demo0
      ORDER BY id(demo0) DESC
      WITH f, study, associations, sb, spec, diag, head(collect(demo0)) AS demo

      OPTIONAL MATCH (sb)<-[:of_participant]-(exp0:exposure)
      WITH f, study, associations, sb, spec, diag, demo, exp0
      ORDER BY id(exp0) DESC
      WITH f, study, associations, sb, spec, diag, demo, head(collect(exp0)) AS exp

      OPTIONAL MATCH (sb)<-[:of_participant]-(ps:participant_status)
      WITH f, study, associations, sb, spec, diag, demo, exp, ps
      ORDER BY coalesce(datetime(ps.updated), datetime(ps.created)) DESC, id(ps) DESC
      WITH f, study, associations, sb, spec, diag, demo, exp, head(collect(ps)) AS ps_latest

      OPTIONAL MATCH (sb)<-[:of_participant]-(tt:targeted_therapy)
      WITH f, study, associations, sb, spec, diag, demo, exp, ps_latest, tt
      ORDER BY tt.targeted_therapy, id(tt) DESC
      WITH
        f, study, associations, sb, spec, diag, demo, exp, ps_latest,
        [x IN COLLECT(DISTINCT tt.targeted_therapy) WHERE x IS NOT NULL AND x <> ''] AS targeted_therapy_raw,
        REDUCE(
          result = '',
          x IN [y IN COLLECT(DISTINCT tt.targeted_therapy) WHERE y IS NOT NULL AND y <> ''] |
            result + CASE WHEN result = '' THEN '' ELSE '|' END + x
        ) AS targeted_therapy_string

      RETURN DISTINCT
        'data file' AS type,
        study.study_short_name AS study_short_name,
        toString(study.study_id) AS study_id,
        study.study_accession AS study_accession,
        f.data_file_name AS data_file_name,
        f.data_file_format AS data_file_format,
        f.data_file_type AS data_file_type,
        f.data_file_size AS data_file_size,
        f.data_file_uuid AS data_file_uuid,
        'drs://nci-crdc.datacommons.io/' + f.data_file_uuid AS drs_uri,
        f.data_file_description AS data_file_description,
        f.data_file_checksum_value AS data_file_checksum_value,
        f.data_file_checksum_type AS data_file_checksum_type,
        f.data_file_location AS data_file_location,
        f.data_file_compression_status AS data_file_compression_status,
        associations AS association,
        sb.participant_id AS participant_id,
        diag.ctep_disease_term AS ctep_disease_term,
        diag.primary_diagnosis_disease_group AS primary_diagnosis_disease_group,
        diag.stage_of_disease AS stage_of_disease,
        diag.tumor_grade AS tumor_grade,
        ps_latest.survival_status AS survival_status,
        diag.primary_disease_site AS primary_disease_site,
        diag.meddra_disease_code AS meddra_disease_code,
        diag.histology AS histology,
        CASE
          WHEN spec IS NULL
            OR spec.anatomical_collection_site IS NULL
            OR trim(spec.anatomical_collection_site) = ''
          THEN ''
          ELSE toLower(spec.anatomical_collection_site)
        END AS anatomical_collection_site,
        COALESCE(spec.specimen_type, '') AS specimen_type,
        COALESCE(spec.tissue_category, '') AS tissue_category,
        COALESCE(spec.assessment_timepoint, '') AS assessment_timepoint,
        COALESCE(spec.specimen_record_id, '') AS specimen_record_id,
        demo.sex AS sex,
        demo.race AS race,
        demo.ethnicity AS ethnicity,
        demo.age_at_enrollment AS age_at_enrollment,
        CASE
          WHEN exp IS NOT NULL AND exp.carcinogen_exposure IS NOT NULL THEN [exp.carcinogen_exposure]
          ELSE []
        END AS carcinogen_exposure,
        targeted_therapy_raw AS targeted_therapy,
        targeted_therapy_string AS targeted_therapy_string,
        CASE WHEN spec IS NOT NULL THEN [
          {
            specimen_record_id: spec.specimen_record_id,
            specimen_id: spec.specimen_id,
            anatomical_collection_site: CASE
              WHEN spec.anatomical_collection_site IS NULL
                OR trim(spec.anatomical_collection_site) = ''
              THEN ''
              ELSE toLower(spec.anatomical_collection_site)
            END,
            specimen_type: spec.specimen_type,
            tissue_category: spec.tissue_category,
            assessment_timepoint: spec.assessment_timepoint
          }
        ] ELSE [] END AS biospecimen_info,
        [{
          data_file_uuid: f.data_file_uuid,
          data_file_format: f.data_file_format,
          data_file_type: f.data_file_type
        }] AS file_info
      SKIP $skip LIMIT $limit
    page_size: 1000
  - index_name: "biospecimen_data_file"
    id_field: "data_file_uuid"
    mapping:
      keyword:
        - type
        - data_file_name
        - data_file_format
        - data_file_type
        - data_file_size
        - data_file_uuid
        - data_file_description
        - participant_id
        - specimen_id
        - specimen_record_id
        - ctep_disease_term
        - primary_diagnosis_disease_group
        - stage_of_disease
        - tumor_grade
        - sex
        - race
        - ethnicity
        - carcinogen_exposure
        - targeted_therapy
        - targeted_therapy_string
        - anatomical_collection_site
        - specimen_type
        - tissue_category
        - assessment_timepoint
    initial_query:
      query: |
        MATCH (f:file)
        OPTIONAL MATCH (sub_direct:participant)<--(f)
        OPTIONAL MATCH (f)-[:associated_with]->(spec_via:specimen)-[:of_participant]->(sub_via:participant)
        WITH
          f,
          coalesce(sub_direct, sub_via)          AS sub,
          head(collect(DISTINCT spec_via))       AS spec
        WHERE sub IS NOT NULL

        OPTIONAL MATCH (tt:targeted_therapy)-[:of_participant]->(sub)
        WITH
          f, sub, spec,
          collect(DISTINCT tt.targeted_therapy)                                   AS tt_raw
        WITH f, sub, spec,
          REDUCE(result = [], t IN tt_raw |
            CASE WHEN t IS NULL OR t = '' THEN result ELSE result + t END)        AS targeted_therapy,
          REDUCE(result = [], t IN tt_raw |
            CASE WHEN t IS NULL OR t = '' THEN result ELSE result + toLower(t) END) AS tt_lower
        UNWIND CASE WHEN size(tt_lower) = 0 THEN [null] ELSE tt_lower END AS tt_item
        WITH f, sub, spec, targeted_therapy, tt_item
        ORDER BY tt_item
        WITH f, sub, spec, targeted_therapy,
          COLLECT(tt_item)                                                        AS tt_sorted
        WITH f, sub, spec, targeted_therapy,
          REDUCE(result = '', t IN tt_sorted |
            CASE WHEN t IS NULL OR t = '' THEN result
                 ELSE result + CASE WHEN result = '' THEN t ELSE '|' + t END
            END)                                                                  AS targeted_therapy_string

        OPTIONAL MATCH (sub)<-[:of_participant]-(diag:diagnosis)
        OPTIONAL MATCH (sub)<-[:of_participant]-(demo:demographic)
        OPTIONAL MATCH (sub)<-[:of_participant]-(exp:exposure)
        WITH
          f, sub, spec, diag, demo,
          targeted_therapy, targeted_therapy_string,
          collect(DISTINCT exp.carcinogen_exposure) AS carcinogen_exposure

        RETURN DISTINCT
          'data file'                                 AS type,

          f.data_file_name                            AS data_file_name,
          f.data_file_format                          AS data_file_format,
          f.data_file_type                            AS data_file_type,
          f.data_file_size                            AS data_file_size,
          f.data_file_uuid                            AS data_file_uuid,
          f.data_file_description                     AS data_file_description,

          spec.specimen_id                            AS specimen_id,
          spec.specimen_record_id                     AS specimen_record_id,
          sub.participant_id                          AS participant_id,

          diag.ctep_disease_term                      AS ctep_disease_term,
          diag.primary_diagnosis_disease_group        AS primary_diagnosis_disease_group,
          diag.stage_of_disease                       AS stage_of_disease,
          diag.tumor_grade                            AS tumor_grade,

          demo.sex                                    AS sex,
          demo.race                                   AS race,
          demo.ethnicity                              AS ethnicity,

          carcinogen_exposure                         AS carcinogen_exposure,
          targeted_therapy                            AS targeted_therapy,
          targeted_therapy_string                     AS targeted_therapy_string,

          toLower(spec.anatomical_collection_site)    AS anatomical_collection_site,
          spec.specimen_type                          AS specimen_type,
          spec.tissue_category                        AS tissue_category,
          spec.assessment_timepoint                   AS assessment_timepoint
          SKIP $skip LIMIT $limit
      page_size: 1000
  - index_name: "about_page"
    type: "about_file"
    # Optional: custom mapping using grouped format (if omitted, default mapping is used)
    mapping:
      keyword:
