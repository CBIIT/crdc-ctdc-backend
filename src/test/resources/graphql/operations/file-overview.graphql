query fileOverview(
  $participant_id: [String]
  $ctep_disease_term: [String]
  $stage_of_disease: [String]
  $tumor_grade: [String]
  $sex: [String]
  $race: [String]
  $ethnicity: [String]
  $carcinogen_exposure: [String]
  $study_short_name: [String]
  $study_id: [String]
  $association: [String]
  # $study_accession: [String]
  $program_name: [String]
  $program_short_name: [String]
  $therapy_name: [String]
  $therapy_string: [String]
  $therapy_category: [String]
  $best_response_to_therapy: [String]
  $therapy_type: [String]
  $current_response_to_therapy: [String]
  $anatomical_collection_site: [String]
  $specimen_type: [String]
  $tissue_category: [String]
  $assessment_timepoint: [String]
  $data_file_type: [String]
  $data_file_format: [String]
  $first: Int = 10
  $offset: Int = 0
  $order_by: String = "data_file_name"
  $sort_direction: String = "ASC"
) {
  fileOverview(
    participant_id: $participant_id
    ctep_disease_term: $ctep_disease_term
    stage_of_disease: $stage_of_disease
    tumor_grade: $tumor_grade
    sex: $sex
    race: $race
    ethnicity: $ethnicity
    carcinogen_exposure: $carcinogen_exposure
    association: $association
    study_short_name: $study_short_name
    study_id: $study_id
    # study_accession: $study_accession
    program_name: $program_name
    program_short_name: $program_short_name
    # targeted_therapy: $targeted_therapy
    therapy_string: $therapy_string
    therapy_name: $therapy_name
    therapy_category: $therapy_category
    best_response_to_therapy: $best_response_to_therapy
    therapy_type: $therapy_type
    current_response_to_therapy: $current_response_to_therapy
    anatomical_collection_site: $anatomical_collection_site
    specimen_type: $specimen_type
    tissue_category: $tissue_category
    assessment_timepoint: $assessment_timepoint
    data_file_type: $data_file_type
    data_file_format: $data_file_format
    first: $first
    offset: $offset
    order_by: $order_by
    sort_direction: $sort_direction
  ) {
    program_name
    program_short_name
    crdc_id
    program_short_description
    program_external_url
    program_full_description
    participant_id
    # study_accession_id
    data_file_name
    data_file_format
    data_file_type
    data_file_size
    association
    data_file_description
    specimen_id
    specimen_record_id
    ctep_disease_term
    data_file_uuid
  }
}
